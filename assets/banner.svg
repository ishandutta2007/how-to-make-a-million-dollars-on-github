<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#34d399;#38bdf8;#fbbf24" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#10b981;#0ea5e9;#f59e0b" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#d97706">
        <animate attributeName="stop-color" values="#d97706;#059669;#0284c7;#d97706" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.65; }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      .floating { animation: floatAnim 4s ease-in-out infinite; }
      .pulsing { animation: pulseGlow 3s ease-in-out infinite; }
      .animated-border {
        stroke-dasharray: 300 150;
        animation: shimmerBorder 10s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg-grad)" />
  <rect x="3" y="3" width="1194" height="394" rx="21" fill="none" stroke="url(#border-grad)" stroke-width="3" opacity="0.9" class="animated-border" />

  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <circle cx="200" cy="200" r="140" fill="#f59e0b" opacity="0.15" filter="url(#glow)" class="pulsing" />
  <circle cx="1000" cy="200" r="150" fill="#10b981" opacity="0.15" filter="url(#glow)" class="pulsing" />
  <circle cx="600" cy="180" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing" />

  <g class="floating">
    <text x="600" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" letter-spacing="4">
      THE OPEN SOURCE MONETIZATION PLAYBOOK
    </text>

    <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="url(#gold-grad)" filter="url(#glow)">
      💰 $1,000,000 ON GITHUB 🚀
    </text>

    <text x="600" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Turn Repositories into Revenue • GitHub Sponsors • Open Core • SaaS &amp; Consulting
    </text>

    <g transform="translate(210, 295)">
      <rect x="0" y="0" width="220" height="44" rx="22" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" opacity="0.9" />
      <text x="110" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fef08a">
        ⭐ GitHub Sponsors
      </text>

      <rect x="240" y="0" width="220" height="44" rx="22" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9" />
      <text x="350" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">
        🦄 Open Core &amp; COSS
      </text>

      <rect x="480" y="0" width="280" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <text x="620" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#bae6fd">
        📈 Unicorn Case Studies
      </text>
    </g>
  </g>
</svg>